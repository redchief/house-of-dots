<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="House of Dots">
  <rect width="64" height="64" rx="14" fill="#ff4500"/>
  <!-- claimed box -->
  <rect x="13" y="30" width="19" height="20" rx="1" fill="#fff" opacity=".35"/>
  <!-- roof + walls drawn as dots-and-boxes lines -->
  <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 30 32 12 51 30"/>
    <path d="M13 30H32V50H13Z"/>
    <path d="M32 30H51M51 30V50"/>
  </g>
  <!-- the open side: someone's next move -->
  <path d="M32 50H51" stroke="#fff" stroke-width="2" stroke-dasharray="1.5 3.5" stroke-linecap="round"/>
  <g fill="#1a1a1b" stroke="#fff" stroke-width="1.6">
    <circle cx="32" cy="12" r="3.4"/>
    <circle cx="13" cy="30" r="3.4"/><circle cx="32" cy="30" r="3.4"/><circle cx="51" cy="30" r="3.4"/>
    <circle cx="13" cy="50" r="3.4"/><circle cx="32" cy="50" r="3.4"/><circle cx="51" cy="50" r="3.4"/>
  </g>
</svg>
